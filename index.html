<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="AniLib - Browse top anime, search your favorite series, and manage your watchlist.">
    <title>AniLib - Your Anime Collection</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Top Glassmorphic Navigation -->
    <header class="app-header">
        <div class="logo">
            <i class="fas fa-film logo-icon"></i> Ani<span>Lib</span>
        </div>
        <nav class="nav-tabs">
            <button class="tab-btn active" id="tab-discover" data-tab="discover">
                <i class="fas fa-compass"></i> Discover
            </button>
            <button class="tab-btn" id="tab-watchlist" data-tab="watchlist">
                <i class="fas fa-heart"></i> Watchlist
            </button>
        </nav>
        <div class="search-wrapper">
            <div class="search-container">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Search anime (e.g. Naruto)..." autocomplete="off">
                <button id="search-clear-btn" class="clear-btn" aria-label="Clear search"><i
                        class="fas fa-times"></i></button>
            </div>
            <button id="search-btn">Search</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-content">
        <!-- Watchlist Filters Bar (Hidden by default, shown on Watchlist tab) -->
        <div class="watchlist-filters-bar" id="watchlist-filters" style="display: none;">
            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">All Anime</button>
                <button class="filter-btn" data-filter="plan"><i class="far fa-bookmark"></i> Plan to Watch</button>
                <button class="filter-btn" data-filter="completed"><i class="fas fa-check-circle"></i>
                    Completed</button>
            </div>
            <div class="watchlist-stats">
                Saved: <span id="watchlist-count">0</span>
            </div>
        </div>

        <div class="section-header">
            <h2 id="section-title">Trending Anime</h2>
            <div class="accent-line"></div>
        </div>

        <!-- Anime Grid -->
        <div class="anime-grid" id="anime-list">
            <!-- Skeleton cards or dynamic content loaded here -->
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="anime-modal" class="modal-overlay">
        <div class="modal-window">
            <button class="close-btn" aria-label="Close modal">&times;</button>
            <div class="modal-layout">
                <div class="modal-sidebar">
                    <div class="modal-image-container">
                        <img id="modal-img" src="" alt="Anime Poster">
                        <div class="modal-image-overlay">
                            <span id="modal-score"><i class="fas fa-star"></i> 8.5</span>
                        </div>
                    </div>
                    <div class="modal-sidebar-actions">
                        <button id="modal-watchlist-btn" class="btn btn-primary btn-block">
                            <i class="fas fa-plus"></i> Add to Watchlist
                        </button>
                        <div id="modal-status-toggle" class="status-selector" style="display: none;">
                            <span class="status-label">Watch Status:</span>
                            <div class="status-options">
                                <button class="status-option-btn" id="status-btn-plan" data-status="plan">Plan to
                                    Watch</button>
                                <button class="status-option-btn" id="status-btn-completed"
                                    data-status="completed">Completed</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-info-panel">
                    <h2 id="modal-title">Anime Title</h2>
                    <div class="modal-metadata">
                        <span id="modal-type" class="meta-badge">TV</span>
                        <span id="modal-episodes" class="meta-badge">24 Episodes</span>
                        <span id="modal-status" class="meta-badge">Finished Airing</span>
                    </div>
                    <div id="modal-genres" class="genres-list">
                        <!-- Genres list dynamically populated -->
                    </div>
                    <div class="synopsis-section">
                        <h3>Synopsis</h3>
                        <p id="modal-synopsis">Detailed anime synopsis goes here...</p>
                    </div>
                    <div class="modal-footer-actions">
                        <a id="modal-watch-link" href="#" target="_blank" class="watch-link-btn">
                            <i class="fas fa-play"></i> Watch on Crunchyroll
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- JavaScript File -->
    <script src="script.js"></script>
</body>

</html>
